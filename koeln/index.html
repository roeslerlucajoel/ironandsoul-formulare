<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Formulare">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Iron&amp;Soul Köln Formulare</title>
<style>
  html,body{margin:0;height:100%;background:#000000;color:#FFFFFF;font:16px/1.5 -apple-system,system-ui,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000000}
  .msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
  .laden{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:2;transition:opacity .25s}
  .laden img{width:150px;height:150px;border-radius:32px;animation:p 1.4s ease-in-out infinite}
  @keyframes p{50%{opacity:.55}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<!-- Hülle für das Iron&Soul Formularterminal Köln.
     Sie trägt nur das App-Symbol und zeigt das Google-Formularterminal darin.
     Der Zugangsschlüssel steht NICHT in dieser Datei, sondern hinten im Link nach dem #:
     https://…/#k=<SCHLUESSEL>  – der Teil nach # wird nie an einen Server geschickt. -->
<div class="msg" id="nokey" hidden>Kein Zugang.<br>Bitte das Formular-Symbol über den vollständigen Link neu anlegen.</div>
<div class="laden" id="laden" hidden><img src="apple-touch-icon.png" alt="Iron&amp;Soul"></div>
<iframe id="app" title="Iron&Soul Formulare" allow="web-share; clipboard-write" hidden></iframe>
<script>
  var EXEC = "https://script.google.com/macros/s/AKfycbw9kk4jvho8bl4F8GnHpujdBIVL07oeZwnel4iSMA9OfWKOLUCxRYCoOyvRLY1gQR7D/exec";
  var m = /(?:^|[#&])k=([A-Za-z0-9]+)/.exec(location.hash);
  if (m) {
    var f = document.getElementById("app");
    var l = document.getElementById("laden");
    l.hidden = false;
    f.addEventListener("load", function () { setTimeout(function () { l.hidden = true; }, 700); });
    // Anmeldung (Standort) merkt sich diese Seite, weil Safari den Speicher im Rahmen sperren kann.
    var st = null; try { st = localStorage.getItem("isAnmeldung"); } catch (e) {}
    f.src = EXEC + "?k=" + m[1] + (st ? "&st=" + encodeURIComponent(st) + "&angemeldet=1" : "");
    window.addEventListener("message", function (ev) {
      if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(ev.origin)) return;
      var d = ev.data || {};
      try {
        if (d.ironSoulAnmeldung) localStorage.setItem("isAnmeldung", String(d.ironSoulAnmeldung));
        if (d.ironSoulAbmeldung) localStorage.removeItem("isAnmeldung");
      } catch (e) {}
    });
    f.hidden = false;
  } else {
    document.getElementById("nokey").hidden = false;
  }
</script>
</body>
</html>
